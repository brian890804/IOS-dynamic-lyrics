name: Build iOS IPA (No Mac Required)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build DynamicLyrics IPA
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: List Available Xcodes
        run: |
          ls -d /Applications/Xcode*
          # 檢查是否有 Xcode 16，若有則直接使用 Xcode 16，否則使用預設
          if [ -d "/Applications/Xcode_16.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer
          else
            # 若 runner 只有 Xcode 15，則不要切換，讓系統維持預設
            echo "Using default installed Xcode"
          fi
          xcodebuild -version

      - name: Generate Xcode Project
        run: |
          brew install xcodegen
          xcodegen generate --spec project.yml
          
          # 關鍵修正：若 Xcode 版本為 15 或更早，強制降級 project.pbxproj 的 objectVersion 為 56
          CURRENT_XCODE_MAJOR=$(xcodebuild -version | head -n 1 | awk '{print $2}' | cut -d. -f1)
          echo "Current Xcode Major Version: $CURRENT_XCODE_MAJOR"
          if [ "$CURRENT_XCODE_MAJOR" -lt 16 ]; then
            echo "Downgrading objectVersion from 77 to 56 for Xcode 15 compatibility..."
            sed -i '' 's/objectVersion = 77;/objectVersion = 56;/g' DynamicLyrics.xcodeproj/project.pbxproj
          fi
          grep "objectVersion" DynamicLyrics.xcodeproj/project.pbxproj

      - name: Build App (Unsigned)
        run: |
          xcodebuild build \
            -project DynamicLyrics.xcodeproj \
            -scheme DynamicLyrics \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            VALIDATE_EMBEDDED_BINARIES=NO

      - name: Package into IPA (Unsigned)
        run: |
          mkdir -p build/Payload
          APP_PATH=$(find build/DerivedData/Build/Products/Release-iphoneos -name "DynamicLyrics.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find build/DerivedData -name "DynamicLyrics.app" -type d | head -n 1)
          fi
          echo "Found compiled app at: $APP_PATH"
          cp -R "$APP_PATH" build/Payload/
          cd build
          zip -r DynamicLyrics.ipa Payload
          cd ..
          ls -lh build/DynamicLyrics.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DynamicLyrics-Unsigned-IPA
          path: build/DynamicLyrics.ipa
          retention-days: 14
