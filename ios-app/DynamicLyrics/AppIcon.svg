<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090a0f"/>
      <stop offset="50%" stop-color="#12131a"/>
      <stop offset="100%" stop-color="#050608"/>
    </linearGradient>

    <!-- Neon Green/Cyan Gradient -->
    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10ffa0"/>
      <stop offset="100%" stop-color="#00d26a"/>
    </linearGradient>

    <!-- Purple/Pink Neon Gradient -->
    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bf55ec"/>
      <stop offset="100%" stop-color="#7028e4"/>
    </linearGradient>

    <!-- Cyberpunk Island Glow -->
    <linearGradient id="islandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1a1c23"/>
      <stop offset="50%" stop-color="#282a36"/>
      <stop offset="100%" stop-color="#1a1c23"/>
    </linearGradient>

    <!-- Filter for Glow Effect -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="strongGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="30" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- iOS App Icon Squircle Canvas -->
  <rect width="1024" height="1024" rx="224" fill="url(#bgGrad)"/>
  <rect width="1020" height="1020" x="2" y="2" rx="222" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4"/>

  <!-- Futuristic Ambient Sound Ring (Car Dashboard Gauge) -->
  <circle cx="512" cy="512" r="380" fill="none" stroke="rgba(16, 255, 160, 0.08)" stroke-width="20" stroke-dasharray="8 16"/>
  <circle cx="512" cy="512" r="330" fill="none" stroke="rgba(191, 85, 236, 0.12)" stroke-width="4" stroke-dasharray="60 30"/>

  <!-- Dynamic Island Pill Container -->
  <rect x="252" y="160" width="520" height="110" rx="55" fill="url(#islandGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="3" filter="url(#neonGlow)"/>
  
  <!-- Dynamic Island Micro Visualizers -->
  <circle cx="310" cy="215" r="16" fill="#10ffa0"/>
  <rect x="360" y="200" width="300" height="30" rx="15" fill="rgba(255,255,255,0.06)"/>
  <rect x="375" y="206" width="180" height="18" rx="9" fill="url(#neonGreen)"/>
  <circle cx="710" cy="215" r="14" fill="#bf55ec"/>

  <!-- Modern 3D/Cartoon Music Note with Cyber Aura -->
  <!-- Note Glow -->
  <g filter="url(#strongGlow)">
    <!-- Right Stem & Beam -->
    <path d="M570,360 L730,320 C745,316 760,328 760,344 L760,620 C760,670 710,710 650,710 C590,710 540,665 540,615 C540,565 590,525 650,525 C665,525 680,530 690,536 L690,410 L570,440 L570,680 C570,730 520,770 460,770 C400,770 350,725 350,675 C350,625 400,585 460,585 C475,585 490,590 500,596 L500,380 C500,365 515,352 530,350 Z" 
          fill="url(#neonGreen)"/>
  </g>

  <!-- High-tech Soundwave Bars at bottom -->
  <g transform="translate(262, 820)">
    <rect x="0" y="20" width="24" height="40" rx="12" fill="#bf55ec" opacity="0.6"/>
    <rect x="42" y="0" width="24" height="80" rx="12" fill="url(#neonGreen)"/>
    <rect x="84" y="25" width="24" height="50" rx="12" fill="#10ffa0"/>
    <rect x="126" y="10" width="24" height="70" rx="12" fill="url(#neonPurple)"/>
    <rect x="168" y="30" width="24" height="40" rx="12" fill="#10ffa0" opacity="0.8"/>
    <rect x="210" y="5" width="24" height="80" rx="12" fill="url(#neonGreen)"/>
    <rect x="252" y="20" width="24" height="60" rx="12" fill="#bf55ec"/>
    <rect x="294" y="0" width="24" height="90" rx="12" fill="#10ffa0"/>
    <rect x="336" y="28" width="24" height="44" rx="12" fill="url(#neonGreen)"/>
    <rect x="378" y="12" width="24" height="68" rx="12" fill="#bf55ec"/>
    <rect x="420" y="30" width="24" height="40" rx="12" fill="#10ffa0"/>
    <rect x="462" y="15" width="24" height="60" rx="12" fill="url(#neonPurple)"/>
  </g>

  <!-- Soft Highlights -->
  <ellipse cx="512" cy="180" rx="300" ry="100" fill="white" opacity="0.03"/>
</svg>
