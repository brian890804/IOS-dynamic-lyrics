name: DynamicLyrics
options:
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.4"

settings:
  SWIFT_VERSION: "5.9"
  CURRENT_PROJECT_VERSION: 1
  MARKETING_VERSION: "1.0.0"
  VALIDATE_EMBEDDED_BINARIES: NO

targets:
  DynamicLyrics:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    bundleId: com.example.DynamicLyrics
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.DynamicLyrics
    sources:
      - path: ios-app/DynamicLyrics
    info:
      path: ios-app/DynamicLyrics/Info.plist
      properties:
        CFBundleIdentifier: com.example.DynamicLyrics
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        UIBackgroundModes:
          - audio
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    dependencies:
      - target: LyricWidget

  LyricWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    bundleId: com.example.DynamicLyrics.LyricWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.DynamicLyrics.LyricWidget
    sources:
      - path: ios-app/LyricWidget
      - path: ios-app/DynamicLyrics/LyricAttributes.swift
    info:
      path: ios-app/LyricWidget/Info.plist
      properties:
        CFBundleIdentifier: com.example.DynamicLyrics.LyricWidget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSSupportsLiveActivities: true
